name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (tokens, types, lint, tests, rules, build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check

  storybook:
    name: Build Storybook
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build-storybook
      - uses: actions/upload-artifact@v7
        with:
          name: storybook-static
          path: storybook-static
          retention-days: 7

  visual:
    name: Visual regression and axe
    needs: storybook
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: storybook-static
          path: storybook-static
      - run: npx playwright install --with-deps chromium
      - name: Report baseline status
        run: |
          if ls tests/visual/__screenshots__/linux/*.png >/dev/null 2>&1; then
            echo "Linux baselines found: any screenshot difference, or a story without a baseline, fails this job."
          else
            echo "::notice title=No visual baselines yet::No Linux baselines are committed, so screenshot tests are skipped (axe still runs). Run the 'Update visual baselines' workflow on this branch."
          fi
      - run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 14
