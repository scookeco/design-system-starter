name: CI

on:
  pull_request:
    # ready_for_review: marking a draft ready starts its visual run.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  # Nightly: the full visual suite, the backstop for pull requests that only run what they reach.
  schedule:
    - cron: '17 6 * * *'
  # By hand, to check a branch outside a pull request (its checks don't count for a pull request's).
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its superseded run. Runs on main are never cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check (tokens, types, lint, tests, rules, build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check

  # Decides whether anything that can change a rendered pixel (or an axe result) changed, which
  # visual run it gets, and the image it runs in.
  # Anything new that feeds the gallery must be added to the `ui` filter, or it skips the visual job.
  changes:
    name: Detect UI changes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ui: ${{ github.event_name == 'pull_request' && steps.filter.outputs.ui || 'true' }}
      # Pull requests and a dispatched run check the stories their changes reach; main and the nightly run check all.
      full: ${{ (github.event_name == 'push' || github.event_name == 'schedule') && 'true' || 'false' }}
      base: ${{ github.base_ref || 'main' }}
      # The lockfile's Playwright: the browser and fonts the Linux baselines were made with.
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v7
      - id: image
        run: echo "image=mcr.microsoft.com/playwright:v$(jq -r '.packages["node_modules/@playwright/test"].version' package-lock.json)-noble" >> "$GITHUB_OUTPUT"
      - uses: dorny/paths-filter@v4
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            ui:
              - 'src/**'
              - 'docs/**'
              - 'tokens/**'
              - 'scripts/checks/**'
              - '.storybook/**'
              - 'CLAUDE.md'
              - 'tests/visual/**'
              - 'playwright.config.ts'
              - 'package.json'
              - 'package-lock.json'
              - '.nvmrc'
              - '.github/workflows/ci.yml'

  storybook:
    name: Build Storybook
    needs: changes
    # Main, nightly and dispatched: always. Pull request: only when ready (not a draft) and something visual changed.
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false && needs.changes.outputs.ui == 'true')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # A run that checks only what changes reach first proves the story graph matches the bundler's
      # (a hole in it would be a missed regression); the self-check builds Storybook as it goes.
      - if: needs.changes.outputs.full != 'true'
        run: npm run test:visual:changed -- --self-check
      - if: needs.changes.outputs.full == 'true'
        run: npm run build-storybook
      - uses: actions/upload-artifact@v7
        with:
          name: storybook-static
          path: storybook-static
          retention-days: 7

  visual:
    name: Visual regression and axe (${{ matrix.shard }}/4)
    needs: [changes, storybook]
    if: needs.storybook.result == 'success'
    runs-on: ubuntu-24.04
    # The image the baselines were made in (npm run test:visual:docker locally): same browser, same
    # fonts, same CPU: a local run's screenshots are these byte for byte. A Playwright bump means new baselines.
    container:
      image: ${{ needs.changes.outputs.image }}
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history: a pull request's run diffs against its base to find what its changes reach.
          fetch-depth: 0
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: storybook-static
          path: storybook-static
      - name: Report baseline status
        run: |
          if ls tests/visual/__screenshots__/linux/*.png >/dev/null 2>&1; then
            echo "Linux baselines found: any screenshot difference, or a story without a baseline, fails this shard."
          else
            echo "::notice title=No visual baselines yet::No Linux baselines are committed, so screenshot tests are skipped (axe still runs). Run the 'Update visual baselines' workflow on this branch."
          fi
      - name: Every story (main, nightly)
        if: needs.changes.outputs.full == 'true'
        run: npx playwright test --shard=${{ matrix.shard }}/4
      - name: The stories this change reaches (pull request, dispatched)
        if: needs.changes.outputs.full != 'true'
        run: npm run test:visual:changed -- --base origin/${{ needs.changes.outputs.base }} -- --shard=${{ matrix.shard }}/4 --pass-with-no-tests
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report
            test-results
          retention-days: 14

  # One stable check name for branch protection. A matrix job skipped by its `if` never
  # expands, so "(1/4)" … "(4/4)" would never report; require this job instead of the shards.
  # It passes when the shards were skipped (a draft, or nothing visual changed).
  visual-gate:
    name: Visual regression and axe
    needs: [changes, storybook, visual]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Every shard passed, or nothing visual changed
        env:
          CHANGES: ${{ needs.changes.result }}
          STORYBOOK: ${{ needs.storybook.result }}
          VISUAL: ${{ needs.visual.result }}
        run: |
          echo "changes: $CHANGES, storybook: $STORYBOOK, visual: $VISUAL"
          if [ "$CHANGES" != "success" ]; then
            echo "::error::Change detection did not succeed."
            exit 1
          fi
          for result in "$STORYBOOK" "$VISUAL"; do
            case "$result" in
              success|skipped) ;;
              *) echo "::error::A visual job ended with '$result'."; exit 1 ;;
            esac
          done
