name: Update visual baselines

# Linux is the source of truth for screenshots, made in the Playwright image the lockfile pins.
# The quick way is local: npm run test:visual:docker -- --update writes them into your branch in that
# image, to commit with the change. This workflow is the same thing for anyone without Docker.
#
# Run it on a branch. By default it rewrites the baselines of the stories the branch's changes reach,
# against main; "full" deletes every Linux baseline and regenerates them all (after a Playwright bump,
# or to drop the baselines of deleted stories). It commits to the branch, then starts CI on it: a push
# made with GITHUB_TOKEN starts no workflow, but a dispatch does.
on:
  workflow_dispatch:
    inputs:
      full:
        description: Regenerate every Linux baseline, not only the stories this branch reaches
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: visual-baselines-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: Playwright image
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
      - id: image
        run: echo "image=mcr.microsoft.com/playwright:v$(jq -r '.packages["node_modules/@playwright/test"].version' package-lock.json)-noble" >> "$GITHUB_OUTPUT"

  update:
    needs: image
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.image.outputs.image }}
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: npm ci
      - name: Regenerate every Linux baseline
        if: inputs.full
        run: |
          # Start clean so baselines of deleted stories do not linger.
          rm -rf tests/visual/__screenshots__/linux
          npm run test:visual:update
      - name: Regenerate the baselines this branch reaches
        if: ${{ !inputs.full }}
        run: npm run test:visual:changed -- --base origin/main -- --grep @visual --update-snapshots=changed --pass-with-no-tests
      - name: Commit baselines to ${{ github.ref_name }}
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A tests/visual/__screenshots__/linux
          if git diff --cached --quiet; then
            echo "Baselines are unchanged."
            exit 0
          fi
          git commit -m "Update Linux visual baselines"
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"
      # The bot's push started nothing; dispatch CI on the branch so its checks run on the new commit.
      - name: Start CI on ${{ github.ref_name }}
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/actions/workflows/ci.yml/dispatches" \
            -d "{\"ref\":\"$BRANCH\"}"
